<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subaru of the Day</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #14171c;
    --accent: #0072ce; /* Subaru blue */
    --text: #f2f4f7;
    --muted: #9aa4b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1f26, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: -0.02em;
  }
  header h1 span {
    color: var(--accent);
  }
  header p {
    color: var(--muted);
    margin: 6px 0 0;
    font-size: 0.95rem;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .image-wrap {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .content {
    padding: 20px 24px 24px;
  }
  .content h2 {
    margin: 0 0 10px;
    font-size: 1.15rem;
    line-height: 1.35;
    font-weight: 600;
  }
  .content h2 a {
    color: inherit;
    text-decoration: none;
  }
  .content h2 a:hover {
    text-decoration: underline;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .refresh-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .refresh-btn:hover { opacity: 0.85; }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }
  .updated {
    color: var(--muted);
    font-size: 0.78rem;
  }
  .state {
    width: 100%;
    max-width: 720px;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .state.error {
    color: #ff8a80;
  }
  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry-btn {
    margin-top: 14px;
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .retry-btn:hover { border-color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>🚗 Subaru <span>of the Day</span></h1>
  <p>The top-voted image posted to r/Subaru today</p>
</header>

<div id="app" class="state">
  <div class="spinner"></div>
  <div>Fetching today's top Subaru...</div>
</div>

<script>
(function () {
  const DATA_URL = "data/today.json";
  const app = document.getElementById("app");

  async function fetchTopPost() {
    const res = await fetch(`${DATA_URL}?_=${Date.now()}`, { headers: { Accept: "application/json" } });
    if (res.status === 404) {
      throw new Error("Today's pick hasn't been generated yet. Check back soon.");
    }
    if (!res.ok) {
      throw new Error(`Failed to load today's pick (${res.status})`);
    }
    const post = await res.json();
    if (!post || !post.imageUrl) {
      throw new Error("Today's data looks incomplete. Check back soon.");
    }
    return post;
  }

  function renderLoading() {
    app.className = "state";
    app.innerHTML = `
      <div class="spinner"></div>
      <div>Fetching today's top Subaru...</div>
    `;
  }

  function renderError(message) {
    app.className = "state error";
    app.innerHTML = `
      <div>⚠️ ${message}</div>
      <button class="retry-btn" id="retryBtn">Try again</button>
    `;
    document.getElementById("retryBtn").addEventListener("click", load);
  }

  function renderPost(post) {
    const updatedLabel = post.fetchedAt
      ? "Updated " + new Date(post.fetchedAt).toLocaleString()
      : "";
    const cardHtml = `
      <div class="card">
        <div class="image-wrap">
          <img src="${post.imageUrl}" alt="${escapeHtml(post.title)}" loading="lazy">
        </div>
        <div class="content">
          <h2><a href="${post.permalink}" target="_blank" rel="noopener noreferrer">${escapeHtml(post.title)}</a></h2>
          <div class="meta">
            <span>⬆️ ${post.score.toLocaleString()}</span>
            <span>💬 ${post.numComments.toLocaleString()}</span>
            <span>u/${escapeHtml(post.author)}</span>
          </div>
          <div class="footer-row">
            <button class="refresh-btn" id="refreshBtn">Refresh</button>
            <span class="updated">${escapeHtml(updatedLabel)}</span>
          </div>
        </div>
      </div>
    `;
    app.className = "";
    app.style.padding = "0";
    app.style.display = "flex";
    app.style.justifyContent = "center";
    app.innerHTML = cardHtml;
    document.getElementById("refreshBtn").addEventListener("click", load);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function load() {
    renderLoading();
    try {
      const post = await fetchTopPost();
      renderPost(post);
    } catch (err) {
      console.error(err);
      renderError(err.message || "Something went wrong loading today's Subaru.");
    }
  }

  load();
})();
</script>

</body>
</html>
